<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART-HAM RSHS</title>

<style>
body {margin:0;font-family:'Segoe UI';background:#f4f6f9;}

header {
background:#0f2d5a;color:white;padding:12px;
display:flex;align-items:center;justify-content:center;gap:12px;
}

header img {height:55px;}

.container {max-width:900px;margin:auto;padding:15px;}

.card {
background:white;padding:20px;margin-top:20px;
border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

input,select,button {
width:100%;padding:10px;margin-top:8px;
border-radius:8px;border:1px solid #ccc;
}

button {
background:#0f2d5a;color:white;border:none;cursor:pointer;
}

.result {margin-top:10px;font-weight:bold;}
.flex2 {display:flex;gap:10px;}

table {
width:100%;border-collapse:collapse;margin-top:10px;
}
th,td {
border:1px solid #ccc;padding:8px;text-align:center;
}
th {background:#0f2d5a;color:white;}

#loadingOverlay {
display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.4);
align-items:center;justify-content:center;z-index:9999;
}
.spinner {
border:5px solid #eee;border-top:5px solid #0f2d5a;
border-radius:50%;width:40px;height:40px;
animation:spin 1s linear infinite;
}
@keyframes spin {100%{transform:rotate(360deg);}}
</style>
</head>

<body>

<header>
<img id="logoUI">
<div>
<strong>SMART-HAM</strong><br>
<small>RSUP Dr. Hasan Sadikin Bandung</small>
</div>
</header>

<div class="container">

<div class="card">
<h3>Identitas Pasien</h3>
<input id="namaPasien" placeholder="Nama Pasien">
<input id="rm" placeholder="No Rekam Medik">
<input id="ttl" type="date">

<div class="flex2">
<input id="perawat1" placeholder="Perawat 1">
<input id="perawat2" placeholder="Perawat 2 (Double Check)">
</div>
</div>

<div class="card">
<h3>Input Klinis</h3>

<select id="drug"></select>
<div id="safeRange"></div>

<input id="weight" type="number" placeholder="Berat Badan (kg)">
<input id="dose" type="number" placeholder="Dosis">
<input id="mg" type="number" placeholder="mg (sediaan obat)">
<input id="ml" type="number" placeholder="ml (pelarut)">

<button onclick="calculateDose()">Hitung</button>
<button onclick="downloadPDF()">Download PDF</button>

<div id="result" class="result"></div>
<div id="tablePreview"></div>
</div>

</div>

<div id="loadingOverlay">
<div style="background:white;padding:20px;border-radius:10px;text-align:center;">
<div class="spinner"></div>
<p>Generating PDF...</p>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

// ===== LOGO BASE64 (SUDAH FIX) =====
const logoBase64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB..."; // tetap tampil
document.getElementById("logoUI").src = logoBase64;

// ===== DATA OBAT =====
const drugs={
adrenaline:{name:"Adrenaline",min:0.01,max:0.3,unit:"mcg/kg/min"},
norepi:{name:"Norepinephrine",min:0.01,max:0.3,unit:"mcg/kg/min"},
dopamine:{name:"Dopamine",min:2,max:20,unit:"mcg/kg/min"}
};

for(let k in drugs){
let o=document.createElement("option");
o.value=k;o.text=drugs[k].name;
drug.appendChild(o);
}

function updateInfo(){
let d=drugs[drug.value];
safeRange.innerHTML=`Dosis Aman: ${d.min} - ${d.max} ${d.unit}`;
}
drug.addEventListener("change",updateInfo);
updateInfo();

// ===== HITUNG =====
function calculateDose(){
let w=parseFloat(weight.value);
let d=parseFloat(dose.value);
let mgv=parseFloat(mg.value);
let mlv=parseFloat(ml.value);

if(!w||!d||!mgv||!mlv){
result.innerHTML="Lengkapi data!";
return;
}

let mlh=((w*d)/(mgv*1000/mlv))*60;
result.innerHTML=`Hasil: ${mlh.toFixed(2)} ml/jam`;

generateTable(w,mgv,mlv);
}

// ===== TABEL UI =====
function generateTable(w,mgv,mlv){
let data=drugs[drug.value];
let html=`<table>
<tr><th>Dosis</th><th>ml/jam</th></tr>`;

let step=(data.max-data.min)/4;

for(let i=0;i<5;i++){
let d=(data.min+(step*i));
let res=((w*d)/(mgv*1000/mlv))*60;
html+=`<tr><td>${d.toFixed(3)}</td><td>${res.toFixed(2)}</td></tr>`;
}

html+="</table>";
tablePreview.innerHTML=html;
}

// ===== PDF =====
function downloadPDF(){

if(result.innerText===""){
alert("Hitung dulu!");
return;
}

loadingOverlay.style.display="flex";

const {jsPDF}=window.jspdf;
let doc=new jsPDF();

setTimeout(()=>{

doc.addImage(logoBase64,"PNG",15,10,30,30);

let y=50;
doc.setFontSize(14);
doc.text("SMART-HAM",50,y); y+=8;
doc.setFontSize(10);
doc.text("RSUP Dr. Hasan Sadikin Bandung",50,y); y+=10;

doc.text("Nama: "+namaPasien.value,20,y); y+=5;
doc.text("RM: "+rm.value,20,y); y+=5;
doc.text("TTL: "+ttl.value,20,y); y+=5;
doc.text("Perawat 1: "+perawat1.value,20,y); y+=5;
doc.text("Perawat 2: "+perawat2.value,20,y); y+=10;

doc.text("Hasil: "+result.innerText,20,y); y+=10;

// ===== TABEL PDF PROFESIONAL =====
let data=drugs[drug.value];
let w=parseFloat(weight.value);
let mgv=parseFloat(mg.value);
let mlv=parseFloat(ml.value);

doc.text("Tabel Dosis:",20,y); y+=5;

// header
doc.setFillColor(15,45,90);
doc.setTextColor(255,255,255);
doc.rect(20,y,60,8,'F');
doc.rect(80,y,80,8,'F');
doc.text("Dosis",25,y+5);
doc.text("Hasil (ml/jam)",85,y+5);
y+=8;

doc.setTextColor(0,0,0);

let step=(data.max-data.min)/4;

for(let i=0;i<5;i++){
let d=(data.min+(step*i));
let res=((w*d)/(mgv*1000/mlv))*60;

doc.rect(20,y,60,8);
doc.rect(80,y,80,8);

doc.text(d.toFixed(3),25,y+5);
doc.text(res.toFixed(2)+" ml/jam",85,y+5);

y+=8;
}

// disclaimer
doc.setFontSize(9);
doc.setTextColor(120);
doc.text("Catatan: Gunakan sebagai alat bantu, verifikasi klinis tetap diperlukan.",20,y+10);

doc.save("SMART-HAM.pdf");

loadingOverlay.style.display="none";

},600);
}
</script>

</body>
</html>
