<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART-HAM RSHS</title>

<style>
body {margin:0;font-family:'Segoe UI';background:#f4f6f9;}
header {background:#0f2d5a;color:white;padding:20px;text-align:center;}
.container {max-width:900px;margin:auto;padding:15px;}
.card {background:white;padding:20px;margin-top:20px;border-radius:12px;}
input,select,button {width:100%;padding:8px;margin-top:5px;}
button {background:#0f2d5a;color:white;border:none;border-radius:8px;}
.result {margin-top:10px;font-weight:bold;}
</style>
</head>

<body>

<header>
<h1>SMART-HAM</h1>
<p>RSUP Dr. Hasan Sadikin Bandung</p>
</header>

<div class="container">
<div class="card">

<select id="drug"></select>

<input type="number" id="weight" placeholder="BB (kg)">
<input type="number" id="dose" placeholder="Dosis">
<input type="number" id="mg" placeholder="mg">
<input type="number" id="ml" placeholder="ml">

<button onclick="calculateDose()">Hitung</button>
<button onclick="downloadPDF()">Download PDF</button>

<div id="result" class="result"></div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const drugs={
adrenaline:{name:"Adrenaline",min:0.01,max:0.3,unit:"mcg/kg/min"},
nicardipine:{name:"Nicardipine",min:0.5,max:5,unit:"mcg/kg/min"},
dobutamine:{name:"Dobutamine",min:2,max:20,unit:"mcg/kg/min"},
fentanyl:{name:"Fentanyl",min:1,max:1.5,unit:"mcg/kg"},
norepi:{name:"Norepinephrine",min:0.01,max:0.3,unit:"mcg/kg/min"},
midazolam:{name:"Midazolam",min:0.05,max:0.1,unit:"mg/kg"},
heparin:{name:"Heparin",min:10,max:20,unit:"unit/kg/hour"}
};

const drugSelect=document.getElementById("drug");

for(let k in drugs){
let o=document.createElement("option");
o.value=k;o.text=drugs[k].name;
drugSelect.appendChild(o);
}

function calculateDose(){
let w=weight.value,d=dose.value,mgv=mg.value,mlv=ml.value;
let drug=drugs[drugSelect.value];

if(!w||!d){result.innerHTML="Lengkapi";return;}

let res="";

if(drug.unit.includes("mcg/kg/min")){
if(!mgv||!mlv){result.innerHTML="Isi konsentrasi";return;}
let mlh=((w*d)/(mgv*1000/mlv))*60;
res=mlh.toFixed(2)+" ml/jam";
}else{
res=(w*d).toFixed(2)+" "+drug.unit.split("/")[0];
}

result.innerHTML="Hasil: "+res;
}

function downloadPDF(){
const {jsPDF}=window.jspdf;
let doc=new jsPDF();

let drug=drugs[drugSelect.value];
let w=parseFloat(weight.value);
let mgv=parseFloat(mg.value);
let mlv=parseFloat(ml.value);

doc.text("SMART-HAM",20,20);
doc.text("Auto Dose Range",20,30);

let doses=[];
let step=(drug.max-drug.min)/4;

for(let i=0;i<5;i++){
doses.push((drug.min+(step*i)).toFixed(2));
}

let y=50;

doc.text("Obat: "+drug.name,20,y); y+=10;
doc.text("BB: "+w+" kg",20,y); y+=10;

doc.text("Range Dosis:",20,y); y+=10;

doses.forEach(d=>{
let res="";

if(drug.unit.includes("mcg/kg/min")){
let mlh=((w*d)/(mgv*1000/mlv))*60;
res=mlh.toFixed(2)+" ml/jam";
}else{
res=(w*d).toFixed(2);
}

doc.text(d+" → "+res,20,y);
y+=8;
});

doc.save("SMART-HAM-RANGE.pdf");
}
</script>

</body>
</html>
